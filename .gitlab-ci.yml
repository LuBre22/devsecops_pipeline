# Alternative to GitHub Actions; requires a privileged Docker executor for DinD.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
stages: [test, demo]
variables:
  GIT_DEPTH: '0'
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ''
default:
  image: docker:27.3.1-cli
  services:
    - name: docker:27.3.1-dind
      command: ['--tls=false']
  before_script:
    - apk add --no-cache python3 py3-pytest git
    - cd devsecops-pipeline
unit-tests:
  stage: test
  script:
    - python3 -m pytest tests -q
demo-verification:
  stage: demo
  script:
    - python3 scripts/prepare.py
    - python3 scripts/demo.py
  artifacts:
    when: always
    expire_in: 4 weeks
    paths:
      - devsecops-pipeline/reports/
