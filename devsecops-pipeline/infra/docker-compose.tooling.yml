# Tooling zone (zone 2 of the architecture plan). Everything runs locally, so
# the pipeline can be demonstrated without hochschule or cloud infrastructure.
#
#   make tooling-up     start
#   make tooling-down   stop and remove volumes
#
# Ports: Gitea 3000 | Vault 8200 | DefectDojo 8081
name: devsecops-tooling

services:
  # ---------------------------------------------------------------------------
  # Git hosting. Lightweight stand-in for GitLab CE when RAM is tight; the
  # pipeline itself is vendor neutral (see .gitlab-ci.yml and the Actions file).
  # ---------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:1.22.3
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
    volumes:
      - gitea-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Secret management (lecture slide 42). Dev mode keeps everything in memory:
  # suitable for a demo, never for production.
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17.6
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-dev-only-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    command: server -dev
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Central defect management for the aggregated findings (requirement F-04).
  # ---------------------------------------------------------------------------
  defectdojo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DD_DB_PASSWORD:-change-me-locally}
    volumes:
      - dd-db:/var/lib/postgresql/data
    restart: unless-stopped

  defectdojo:
    image: defectdojo/defectdojo-django:2.38.1
    depends_on: [defectdojo-db]
    environment:
      DD_DATABASE_URL: postgresql://defectdojo:${DD_DB_PASSWORD:-change-me-locally}@defectdojo-db:5432/defectdojo
      DD_ALLOWED_HOSTS: "*"
      DD_DEBUG: "False"
      DD_ADMIN_USER: admin
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD:-set-this-in-your-env-file}
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Local image registry for stage 9 (publish) without any external account.
  # ---------------------------------------------------------------------------
  registry:
    image: registry:2.8.3
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

volumes:
  gitea-data:
  dd-db:
  registry-data:
