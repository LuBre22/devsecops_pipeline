# Repository/history scan. Only deliberate negative examples are allowlisted.
# The separate workload scan uses .gitleaks-workload.toml with NO such exclusion.
[extend]
useDefault = true

[allowlist]
description = "Documentation and report artefacts"
paths = [
  '''docs/validation/.*''',
  '''docs/.*\.md''',
  '''reports/.*''',
  '''README\.md''',
  '''workloads/.*/vulnerable/.*''',
  '''tests/fixtures/.*''',
]
